// ---------- pure logic (tested in node) ----------
function toTwos(n, bits) {
  if (n < 0) n = n + 2 ** bits;
  let s = "";
  for (let i = 0; i < bits; i++) { s = (n % 2) + s; n = Math.floor(n / 2); }
  return s;
}
function toBinary(n, bits) { return toTwos(n, bits); }
function fromTwos(b) {
  let v = 0;
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let p = 2 ** (n - 1 - i);
    if (i === 0) p = -p;
    if (b[i] === "1") v += p;
  }
  return v;
}
function fpEncode(x, m = 15, e = 8) {
  const sign = x < 0 ? "1" : "0";
  x = Math.abs(x);
  let exp = 0;
  while (x >= 1) { x /= 2; exp++; }
  while (x > 0 && x < 0.5) { x *= 2; exp--; }
  let mant = "";
  for (let i = 0; i < m; i++) { x *= 2; const d = Math.floor(x); mant += d; x -= d; }
  return { sign, mantissa: mant, exponent: toTwos(exp, e), exp };
}
function fpDecode(sign, mant, expBits) {
  const e = fromTwos(expBits);
  let m = 0;
  for (let i = 0; i < mant.length; i++) if (mant[i] === "1") m += 2 ** -(i + 1);
  return (sign === "1" ? -1 : 1) * m * 2 ** e;
}
function sameNumber(input, answer) {
  const clean = String(input).replace(/[\s,£]/g, "").replace(/bytes?$/i, "").replace(/−/g, "-");
  if (clean === "") return false;
  const v = Number(clean);
  return !Number.isNaN(v) && Math.abs(v - Number(answer)) < 1e-9;
}
function sameText(input, accepted) {
  const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9.\-]/g, "");
  return accepted.some((a) => norm(a) === norm(input));
}
function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seedText) {
  let seed = 0;
  for (const ch of seedText) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
  const r = mulberry(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === arr[i]) && a.length > 1) a.push(a.shift());
  return a;
}
if (false) module.exports = { toTwos, fromTwos, fpEncode, fpDecode, sameNumber, sameText, seededShuffle };

}

  blocks: [
    { type: "text", html: `<h3>The food festival website</h3><p>The Tay Coast Food Festival wants a website with a home page, pages for the stalls, the cookery classes and how to get there, and a link to the council's travel page.</p><ul><li><b>End-user requirements</b> are what visitors want to do: <i>"I want to see which cookery classes are on."</i></li><li><b>Functional requirements</b> are the pages and features the site must have: <i>"A cookery page, linked from the home page, with a video of a demonstration."</i></li></ul>` },
    TIP("Web candidates often wrote end-user requirements when asked for functional requirements. Functional requirements describe the <b>pages, their content and the links</b>, not what the user wants."),
    { type: "match", id: "1a", q: "End-user requirement or functional requirement?", options: ["End-user requirement", "Functional requirement"], items: [["Visitors want to know how to get to the festival", 0], ["A Travel page linked from every page, containing a map image", 1], ["Parents want to know if there are activities for children", 0], ["The home page links to Stalls, Classes and Travel", 1]] },
    { type: "text", html: `<h3>Site structure</h3><p>A <b>structure diagram</b> for a website shows the home page, the pages linked from it (at National 5, up to four), and any external links:</p><figure class="fig"><svg viewBox="0 0 560 170" role="img" aria-label="Site structure: Home page links to Stalls, Classes and Travel; Travel has an external link to the council travel site" style="max-width:540px;width:100%;color:var(--ink,#1d1438)"><g fill="none" stroke="currentColor" stroke-width="1.6"><rect x="210" y="10" width="140" height="40" rx="6"/><rect x="20" y="100" width="130" height="40" rx="6"/><rect x="215" y="100" width="130" height="40" rx="6"/><rect x="410" y="100" width="130" height="40" rx="6"/><line x1="280" y1="50" x2="280" y2="75"/><line x1="85" y1="75" x2="475" y2="75"/><line x1="85" y1="75" x2="85" y2="100"/><line x1="280" y1="75" x2="280" y2="100"/><line x1="475" y1="75" x2="475" y2="100"/><line x1="475" y1="140" x2="475" y2="160" stroke-dasharray="4 3"/></g><g fill="currentColor" font-size="14" text-anchor="middle"><text x="280" y="35">Home</text><text x="85" y="125">Stalls</text><text x="280" y="125">Classes</text><text x="475" y="125">Travel</text><text x="410" y="166" font-size="12" text-anchor="end">external link: council travel site</text></g></svg></figure>` },
    { type: "num", id: "1b", q: "How many pages, including the home page, does this site structure have?", answer: 4 },
  ],
  exam: [
    { type: "written", id: "1x", q: "State two functional requirements for the festival's Classes page. (2)", marks: 2, points: ["Two features/content of the page, e.g. a list of classes with times / a video of a demonstration / a link back to the home page / a booking phone number (any two)"] },
  ],
},
{
  id: "design", num: 2, title: "Wireframes and prototypes",
  intentions: ["I can design pages with wireframes showing navigation, consistency, the position of media and file formats", "I can produce a low-fidelity prototype from wireframes"],
  recall: [
    { type: "choice", id: "2r1", q: "Recall: which kind of requirement describes the pages a site must have?", options: ["End-user", "Functional"], correct: 1 },
  ],
  blocks: [
    { type: "text", html: `<h3>Wireframes</h3><p>A wireframe for each page shows where every element goes. At National 5 it shows:</p><ul><li><b>navigation</b>: the links and where they go</li><li><b>consistency</b>: the same layout, header, navigation and footer on every page</li><li>the <b>vertical position</b> of text, images, audio and video</li><li>the <b>file formats</b> of the media (for example JPEG, MP3, MP4)</li></ul><pre class="code">+--------------------------------------------------+
| HEADER: festival logo (logo.png)  + title        |
| NAV: Home | Stalls | Classes | Travel             |
+--------------------------------------------------+
| Heading: Cookery classes                         |
| Paragraph: class times                           |
| VIDEO: demo.mp4, with controls                   |
| AUDIO: interview with chef (chef.mp3)            |
+--------------------------------------------------+
| FOOTER: contact details (same on every page)     |
+--------------------------------------------------+</pre>` },
    { type: "multi", id: "2a", q: "Select everything this wireframe shows.", options: ["The order of the media down the page", "The file format of the video", "The links in the navigation bar", "The CSS code for the heading", "That the footer is the same on every page"], correct: [0, 1, 2, 4] },
    { type: "text", html: `<h3>Low-fidelity prototypes</h3><p>A <b>low-fidelity prototype</b> is made from the wireframes, often on paper, before the site is built. Users try it ("tap" a link and the next sheet is shown) so problems with layout and navigation are found early, when they are quick to fix.</p>` },
    { type: "choice", id: "2b", q: "Why is a low-fidelity prototype made before the website is built?", options: ["So users can try the layout and navigation early, when changes are quick and cheap", "Because it is the finished website", "To test the server", "To check the file sizes"], correct: 0 },
  ],
  exam: [
    { type: "written", id: "2x", q: "Describe two ways a wireframe could make sure the festival site is consistent. (2)", marks: 2, points: ["The same header/logo in the same position on every page", "The same navigation bar on every page", "The same footer/colours/fonts on every page (any two)"] },
  ],
},
{
  id: "media", num: 3, title: "Media, file formats and copyright",
  intentions: ["I can compare WAV and MP3, and JPEG, GIF and PNG", "I can explain the factors that affect file size and quality, and the need for compression", "I can describe the implications of the Copyright, Designs and Patents Act 1988"],
  recall: [
    { type: "choice", id: "3r1", q: "Recall: what is a low-fidelity prototype usually made with?", options: ["Paper sketches made from the wireframes", "The finished HTML", "A database"], correct: 0 },
  ],
  blocks: [
    { type: "text", html: `<h3>File formats</h3><table class="tbl"><tr><th>Format</th><th>Type</th><th>Compression</th><th>Good for</th></tr><tr><td>WAV</td><td>Audio</td><td>Usually uncompressed: very high quality, large files</td><td>Editing and archiving sound</td></tr><tr><td>MP3</td><td>Audio</td><td>Lossy: much smaller files, small loss of quality</td><td>Music and speech on websites: quick to download and stream</td></tr><tr><td>JPEG</td><td>Image</td><td>Lossy; 24-bit colour (16.7 million colours)</td><td>Photographs</td></tr><tr><td>GIF</td><td>Image</td><td>Lossless; only 256 colours; can be animated and have transparency</td><td>Simple graphics, logos, animations</td></tr><tr><td>PNG</td><td>Image</td><td>Lossless; millions of colours; supports transparency</td><td>Logos and graphics needing high quality or a transparent background</td></tr></table><p><b>Lossy</b> compression permanently removes some data the user is unlikely to notice. <b>Lossless</b> compression makes the file smaller without losing any data.</p>` },
    TIP("The benefits of MP3 and WAV were poorly understood. MP3's benefit is a much <b>smaller file</b>, so it downloads and streams quickly; WAV's benefit is <b>higher quality</b>, because no data is removed."),
    { type: "match", id: "3a", q: "Choose the best format for each.", options: ["WAV", "MP3", "JPEG", "GIF", "PNG"], items: [["A photo of the seafront for the home page", 2], ["A spinning animated logo", 3], ["A chef's interview that visitors stream on their phones", 1], ["The original recording of the band, kept for editing", 0], ["A logo with a transparent background and smooth colours", 4]] },
    { type: "text", html: `<h3>File size and quality</h3><ul><li><b>Images</b>: a higher <b>resolution</b> (more pixels) and a greater <b>colour depth</b> (more bits per pixel) give better quality but a larger file.</li><li><b>Audio</b>: a higher <b>sampling rate</b> (samples per second) gives better quality but a larger file; so does a longer recording.</li><li><b>Compression</b> is needed because large files take longer to download, use more of the user's data, and take up more storage on the server.</li></ul>` },
    { type: "multi", id: "3b", q: "Select every change that would make an image file larger.", options: ["Increasing the resolution", "Increasing the colour depth", "Saving it as a JPEG instead of uncompressed", "Reducing the number of colours"], correct: [0, 1] },
    { type: "text", html: `<h3>Copyright, Designs and Patents Act 1988</h3><p>Text, images, music and video belong to whoever created them. Under the Act it is illegal to copy, use or share someone else's work, for example putting a photo you found online onto the festival site, <b>without the copyright holder's permission</b>. Use your own work, get permission (and credit it), or use media with a licence that allows it.</p>` },
    { type: "choice", id: "3c", q: "The festival wants to use a song by a well-known band as background music on its site. What must it do?", options: ["Nothing: the song is on the internet", "Get permission from the copyright holder, or it breaks the Copyright, Designs and Patents Act", "Convert it to MP3 first", "Credit the band in the footer, which is enough"], correct: 1 },
  ],
  exam: [
    { type: "written", id: "3x", q: "Explain why the festival should use MP3 rather than WAV for an audio clip on its website. (2)", marks: 2, points: ["MP3 uses lossy compression, so the file is much smaller", "so it downloads/streams more quickly for visitors (and uses less data)"] },
  ],
},
{
  id: "html", num: 4, title: "HTML",
  intentions: ["I can use the core HTML elements: headings, paragraphs, lists, div, images, audio and video"],
  recall: [
    { type: "choice", id: "4r1", q: "Recall: which image format is best for a photograph?", options: ["GIF", "JPEG", "WAV"], correct: 1 },
  ],
  blocks: [
    { type: "text", html: `<h3>Core elements</h3><pre class="code">&lt;html&gt;
&lt;head&gt;&lt;title&gt;Classes&lt;/title&gt;&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Cookery classes&lt;/h1&gt;            heading (h1 to h6)
  &lt;p&gt;Classes run every hour.&lt;/p&gt;      paragraph
  &lt;ul&gt;&lt;li&gt;Fish&lt;/li&gt;&lt;li&gt;Baking&lt;/li&gt;&lt;/ul&gt;   unordered (bullet) list
  &lt;ol&gt;&lt;li&gt;Book&lt;/li&gt;&lt;li&gt;Pay&lt;/li&gt;&lt;/ol&gt;     ordered (numbered) list
  &lt;div&gt; ... &lt;/div&gt;                   a section that groups elements
  &lt;img src="images/chef.jpg" alt="Our chef"&gt;
  &lt;audio src="chef.mp3" controls&gt;&lt;/audio&gt;
  &lt;video src="demo.mp4" controls&gt;&lt;/video&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>` },
    { type: "web", id: "4a", q: "Build the Classes page: an h1 heading <b>Cookery classes</b>, a paragraph, an <b>unordered list</b> of three classes (Fish, Baking, Street food), and an <b>ordered list</b> of the two booking steps (Choose a class, Pay at the tent).",
      starter: PAGE(""),
      model: PAGE(`<h1>Cookery classes</h1>
<p>Classes run every hour from 10 am.</p>
<ul>
  <li>Fish</li>
  <li>Baking</li>
  <li>Street food</li>
</ul>
<ol>
  <li>Choose a class</li>
  <li>Pay at the tent</li>
</ol>`),
      checks: [
        (d) => (d.querySelector("h1") && /Cookery classes/i.test(d.querySelector("h1").textContent) ? null : "Add an h1 heading: Cookery classes."),
        (d) => (d.querySelector("p") ? null : "Add a paragraph."),
        (d) => { const u = d.querySelector("ul"); return u && u.querySelectorAll("li").length === 3 ? null : "Add an unordered list (ul) with three li items."; },
        (d) => { const o = d.querySelector("ol"); return o && o.querySelectorAll("li").length === 2 ? null : "Add an ordered list (ol) with two li items."; },
      ] },
    { type: "web", id: "4b", q: "Add the media: an image <span class='mono'>images/chef.jpg</span> with alternative text, an audio clip <span class='mono'>chef.mp3</span> and a video <span class='mono'>demo.mp4</span>. Both the audio and video need <b>controls</b> so visitors can play them.",
      starter: PAGE(`<h1>Meet the chef</h1>`),
      model: PAGE(`<h1>Meet the chef</h1>
<img src="images/chef.jpg" alt="Chef Morven Gray at the festival">
<audio src="chef.mp3" controls></audio>
<video src="demo.mp4" controls></video>`),
      checks: [
        (d) => { const i = d.querySelector("img"); const src = (i && i.getAttribute("src")) || ""; let shown = src; try { if (src.startsWith("data:image/svg+xml;base64,")) shown = atob(src.split(",")[1]); } catch (e) {} return i && (/images\/chef\.jpg$/.test(src) || />chef<\/text>/.test(shown)) ? null : "Add an img element with src=\"images/chef.jpg\"."; },
        (d) => ((d.querySelector("img").getAttribute("alt") || "").trim() ? null : "Give the image alternative text with alt=\"…\"."),
        (d) => { const a = d.querySelector("audio"); return a && /chef\.mp3$/.test(a.getAttribute("src") || (a.querySelector("source") || { getAttribute: () => "" }).getAttribute("src")) ? null : "Add an audio element with src=\"chef.mp3\"."; },
        (d) => (d.querySelector("audio").hasAttribute("controls") ? null : "Add controls to the audio element."),
        (d) => { const v = d.querySelector("video"); return v && /demo\.mp4$/.test(v.getAttribute("src") || (v.querySelector("source") || { getAttribute: () => "" }).getAttribute("src")) && v.hasAttribute("controls") ? null : "Add a video element with src=\"demo.mp4\" and controls."; },
      ] },
  ],
  exam: [
    { type: "written", id: "4x", q: "Explain why the img element should have an alt attribute. (1)", marks: 1, points: ["The alternative text is read by screen readers / shown if the image doesn't load, so the content is still available"] },
  ],
},
{
  id: "links", num: 5, title: "Hyperlinks",
  intentions: ["I can create internal and external hyperlinks", "I can use relative and absolute addresses, including folder paths"],
  recall: [
    { type: "choice", id: "5r1", q: "Recall: which attribute lets visitors play a video?", options: ["play", "controls", "autoplay only"], correct: 1 },
  ],
  blocks: [
    { type: "text", html: `<h3>Links</h3><pre class="code">&lt;a href="classes.html"&gt;Classes&lt;/a&gt;                     internal, relative
&lt;a href="https://www.dundeecity.gov.uk"&gt;Council&lt;/a&gt;    external, absolute</pre><ul><li>An <b>internal</b> link goes to a page in the same website; an <b>external</b> link goes to a different website.</li><li>An <b>absolute</b> address is the full address, starting with <span class="mono">https://</span>. A <b>relative</b> address gives the location from the current page.</li></ul><h3>Folder paths</h3><pre class="code">festival/
  index.html
  classes.html
  images/
    logo.png
  pages/
    travel.html</pre><ul><li>From <span class="mono">index.html</span> to the logo: <span class="mono">images/logo.png</span> (go into the images folder)</li><li>From <span class="mono">pages/travel.html</span> back to the home page: <span class="mono">../index.html</span> (<span class="mono">..</span> means go up one folder)</li></ul>` },
    TIP("Anchor tag syntax and folder paths were error-prone. Check the opening <span class='mono'>&lt;a href=\"…\"&gt;</span>, the link text, and the closing <span class='mono'>&lt;/a&gt;</span>, and work out the path one folder at a time."),
    { type: "match", id: "5a", q: "Classify each link.", options: ["Internal, relative", "External, absolute"], items: [["<span class='mono'>&lt;a href=\"stalls.html\"&gt;</span>", 0], ["<span class='mono'>&lt;a href=\"https://www.visitscotland.com\"&gt;</span>", 1], ["<span class='mono'>&lt;a href=\"pages/travel.html\"&gt;</span>", 0], ["<span class='mono'>&lt;a href=\"https://www.bbc.co.uk/weather\"&gt;</span>", 1]] },
    { type: "gap", id: "5b", q: "Using the folder structure above, complete each path.", text: "From index.html to travel.html: {{pages/travel.html}}. From travel.html to the logo: {{../images/logo.png}}. From travel.html to classes.html: {{../classes.html}}" },
    { type: "web", id: "5c", q: "Add a navigation bar of three links: <b>Home</b> to <span class='mono'>index.html</span>, <b>Classes</b> to <span class='mono'>classes.html</span>, and <b>Council travel</b> to the external site <span class='mono'>https://www.dundeecity.gov.uk</span>.",
      starter: PAGE(`<h1>Tay Coast Food Festival</h1>`),
      model: PAGE(`<h1>Tay Coast Food Festival</h1>
<div>
  <a href="index.html">Home</a>
  <a href="classes.html">Classes</a>
  <a href="https://www.dundeecity.gov.uk">Council travel</a>
</div>`),
      checks: [
        (d) => { const a = [...d.querySelectorAll("a")].find((x) => x.getAttribute("href") === "index.html"); return a && /Home/i.test(a.textContent) ? null : "Add a link with the text Home and href=\"index.html\"."; },
        (d) => { const a = [...d.querySelectorAll("a")].find((x) => x.getAttribute("href") === "classes.html"); return a && /Classes/i.test(a.textContent) ? null : "Add a link with the text Classes and href=\"classes.html\"."; },
        (d) => { const a = [...d.querySelectorAll("a")].find((x) => /^https:\/\/www\.dundeecity\.gov\.uk\/?$/.test(x.getAttribute("href") || "")); return a && /Council travel/i.test(a.textContent) ? null : "Add an external link with the text Council travel to https://www.dundeecity.gov.uk (an absolute address)."; },
      ] },
  ],
  exam: [
    { type: "written", id: "5x", q: "Write the HTML for a link with the text <i>Back to home</i> from <span class='mono'>pages/travel.html</span> to <span class='mono'>index.html</span>. (2)", marks: 2, points: ["<a href=\"../index.html\"> (correct relative path going up one folder)", "Back to home</a> (link text and closing tag)"] },
  ],
},
{
  id: "css", num: 6, title: "CSS",
  intentions: ["I can use internal and external stylesheets", "I can use selectors, classes and IDs", "I can set font family, size, colour, alignment and background colour"],
  recall: [
    { type: "choice", id: "6r1", q: "Recall: what does .. mean in a folder path?", options: ["The current folder", "Go up one folder", "The images folder"], correct: 1 },
  ],
  blocks: [
    { type: "text", html: `<h3>Stylesheets</h3><ul><li>An <b>internal stylesheet</b> is a <span class="mono">&lt;style&gt;</span> element in the head of one page, and only styles that page.</li><li>An <b>external stylesheet</b> is a separate .css file linked from every page with <span class="mono">&lt;link rel="stylesheet" href="style.css"&gt;</span>. One change to the file changes every page, which keeps the site consistent and saves time.</li></ul><pre class="code">h1 { font-family: Arial; color: navy; text-align: center; }   /* element selector */
.highlight { background-color: yellow; }                    /* class: any number of elements */
#bottom { font-size: 12px; }                                /* ID: one unique element */</pre><p>In the HTML: <span class="mono">&lt;p class="highlight"&gt;</span> and <span class="mono">&lt;div id="bottom"&gt;</span>.</p>` },
    TIP("Explanations of stylesheets and classes were vague. Say <b>what</b> it styles and <b>why</b>: \"a class can be applied to several elements, so the two offer paragraphs share one rule\", or \"an external stylesheet is linked from every page, so a change in one file changes the whole site\"."),
    { type: "web", id: "6a", q: "Using the internal stylesheet: make the h1 <b>Arial</b>, <b>navy</b> and <b>centre-aligned</b>; make paragraphs <b>16px</b>; and give the body a background colour of <b>lightyellow</b>.",
      starter: PAGE(FEST_BODY, ""),
      model: PAGE(FEST_BODY, `h1 { font-family: Arial; color: navy; text-align: center; }
p { font-size: 16px; }
body { background-color: lightyellow; }`),
      checks: [
        (d, w) => (/arial/i.test(w.getComputedStyle(d.querySelector("h1")).fontFamily) ? null : "Set the h1's font-family to Arial."),
        (d) => (sameColour(d, d.querySelector("h1"), "color", "navy") ? null : "Set the h1's color to navy."),
        (d, w) => (w.getComputedStyle(d.querySelector("h1")).textAlign === "center" ? null : "Set the h1's text-align to center."),
        (d, w) => (w.getComputedStyle(d.querySelector("p")).fontSize === "16px" ? null : "Set paragraphs to font-size: 16px."),
        (d, w) => { const probe = d.createElement("span"); probe.style.backgroundColor = "lightyellow"; d.body.appendChild(probe); const want = w.getComputedStyle(probe).backgroundColor; probe.remove(); return w.getComputedStyle(d.body).backgroundColor === want ? null : "Set the body's background-color to lightyellow."; },
      ] },
    TIP("In the assignment, candidates misapplied the <b>ID styles they were given</b> (such as top, voteUs and bottom). Before editing a stylesheet, find which element in the HTML has each ID, and understand what each supplied style is for."),
    { type: "web", id: "6b", q: "The page already uses the class <span class='mono'>highlight</span> and the IDs <span class='mono'>top</span>, <span class='mono'>signUp</span> and <span class='mono'>bottom</span>. Complete the stylesheet: the <b>highlight</b> class gets a <b>yellow</b> background; <b>#top</b> gets a <b>navy</b> background with <b>white</b> text; <b>#signUp</b> text is <b>centre-aligned</b>; <b>#bottom</b> text is <b>12px</b>.",
      starter: PAGE(FEST_BODY, `.highlight {
}

#top {
}

#signUp {
}

#bottom {
}`),
      model: PAGE(FEST_BODY, `.highlight {
  background-color: yellow;
}

#top {
  background-color: navy;
  color: white;
}

#signUp {
  text-align: center;
}

#bottom {
  font-size: 12px;
}`),
      checks: [
        (d, w) => { const ps = [...d.querySelectorAll(".highlight")]; return ps.length === 2 && ps.every((p) => sameColour(d, p, "backgroundColor", "yellow")) ? null : "Give the highlight class a yellow background-color: both highlighted paragraphs should be yellow."; },
        (d, w) => (sameColour(d, d.querySelector("p:not(.highlight)"), "backgroundColor", "transparent") || w.getComputedStyle(d.querySelector("p:not(.highlight)")).backgroundColor === "rgba(0, 0, 0, 0)" ? null : "Only the paragraphs with class=\"highlight\" should be yellow: use .highlight, not p."),
        (d) => { const t = d.getElementById("top"); return sameColour(d, t, "backgroundColor", "navy") && sameColour(d, t.querySelector("h1"), "color", "white") ? null : "Style #top with a navy background-color and white color."; },
        (d, w) => (w.getComputedStyle(d.querySelector("#signUp p")).textAlign === "center" ? null : "Centre-align the text in #signUp."),
        (d, w) => (w.getComputedStyle(d.querySelector("#bottom p")).fontSize === "12px" ? null : "Set #bottom's font-size to 12px."),
      ] },
    { type: "match", id: "6c", q: "Which should each style use?", options: ["Element selector", "Class", "ID"], items: [["Every paragraph on the page", 0], ["Two special-offer paragraphs", 1], ["The one footer at the bottom of the page", 2], ["Every h2 heading", 0]] },
  ],
  exam: [
    { type: "written", id: "6x", q: "Explain why the festival site should use an external stylesheet. (2)", marks: 2, points: ["One stylesheet file is linked to every page", "so a single change updates every page / keeps the pages consistent / less code to write"] },
  ],
},
{
  id: "javascript", num: 7, title: "JavaScript mouse events",
  intentions: ["I can identify onmouseover and onmouseout events", "I can describe what mouse-event code does on a page"],
  recall: [
    { type: "choice", id: "7r1", q: "Recall: which CSS selector styles a single element with id=\"bottom\"?", options: [".bottom", "#bottom", "bottom"], correct: 1 },
  ],
  blocks: [
    { type: "text", html: `<h3>Mouse events</h3><p><b>onmouseover</b> runs code when the pointer moves onto an element; <b>onmouseout</b> runs code when it moves off.</p><pre class="code">&lt;img src="images/stall.jpg"
     onmouseover="this.src='images/stall-night.jpg'"
     onmouseout="this.src='images/stall.jpg'"&gt;

&lt;p onmouseover="this.style.color='red'"
   onmouseout="this.style.color='black'"&gt;Book now&lt;/p&gt;</pre><p>On this page, when the pointer moves onto the stall photo it changes to the night-time photo, and changes back when the pointer moves off. The <i>Book now</i> paragraph turns red while the pointer is over it.</p>` },
    TIP("Answers described JavaScript in general rather than relating it to the page built. Say what happens on <b>this</b> page: which element, which event, and what changes."),
    { type: "web", id: "7a", q: "Make the paragraph <b>Book now</b> turn <b>red</b> when the pointer moves onto it and <b>black</b> when it moves off, using onmouseover and onmouseout.",
      starter: PAGE(`<h1>Cookery classes</h1>
<p id="book">Book now</p>`),
      model: PAGE(`<h1>Cookery classes</h1>
<p id="book" onmouseover="this.style.color='red'" onmouseout="this.style.color='black'">Book now</p>`),

  const t = S.tasks[b.id];

function placeRow(kind, n) {
  if (kind === "none") return "";
  const vals = [];
  for (let i = 0; i < n; i++) vals.push(2 ** (n - 1 - i));
  if (kind === "twos") vals[0] = "−" + vals[0];
  return `<div class="bitrow places">${vals.map((v) => `<span>${v}</span>`).join("")}</div>`;
}
function bitCells(group, n, values) {
  let h = "";
  for (let i = 0; i < n; i++) h += `<button type="button" class="bit" data-group="${group}" data-i="${i}" aria-label="${group} bit ${i + 1}">${values ? values[i] : "0"}</button>`;
  return h;
}

// ---------- reading answers ----------
const readBits = (node, g) => [...node.querySelectorAll(`.bit[data-group="${g}"]`)].map((x) => x.textContent).join("");
function markBits(node, g, answer) {
  node.querySelectorAll(`.bit[data-group="${g}"]`).forEach((x, i) => x.classList.toggle("wrong", x.textContent !== answer[i]));
}
function fillBits(node, g, answer) { node.querySelectorAll(`.bit[data-group="${g}"]`).forEach((x, i) => { x.textContent = answer[i]; x.classList.remove("wrong"); }); }

function evaluate(b, node) {
  switch (b.type) {
    case "num": { const v = node.querySelector("input").value; return { v, ok: sameNumber(v, b.answer) }; }
    case "gap": {
      const ins = [...node.querySelectorAll("input.gap")];
      const answers = [...b.text.matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|"));
      const v = ins.map((i) => i.value);
      let ok = true;
      ins.forEach((inp, i) => { const good = sameText(inp.value, answers[i]); inp.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "trace": {
      const ins = [...node.querySelectorAll("input.gap")];
      const answers = [...b.rows.flat().join("\u0001").matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|"));
      const v = ins.map((i) => i.value);
      let ok = true;
      ins.forEach((inp, i) => { const good = sameText(inp.value, answers[i]); inp.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "bits": { const v = readBits(node, "b"); markBits(node, "b", b.answer); return { v: v.split(""), ok: v === b.answer }; }
    case "fp": {
      const a = fpEncode(b.value);
      const v = { s: readBits(node, "s").split(""), m: readBits(node, "m").split(""), e: readBits(node, "e").split("") };
      markBits(node, "s", a.sign); markBits(node, "m", a.mantissa); markBits(node, "e", a.exponent);
      return { v, ok: v.s.join("") === a.sign && v.m.join("") === a.mantissa && v.e.join("") === a.exponent };
    }
    case "multi": {
      const v = [...node.querySelectorAll(".opt.picked")].map((x) => Number(x.dataset.i));
      const ok = v.length === b.correct.length && b.correct.every((c) => v.includes(c));
      return { v, ok };
    }
    case "match": {
      const sels = [...node.querySelectorAll("select")];
      const v = sels.map((s) => s.value);
      let ok = true;
      sels.forEach((s, i) => { const good = s.value !== "" && Number(s.value) === b.items[i][1]; s.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "order": {
      const shown = seededShuffle(b.items, b.id);
      const sels = [...node.querySelectorAll("select")];
      const v = sels.map((s) => s.value);
      let ok = true;
      sels.forEach((s, i) => { const good = Number(s.value) === b.items.indexOf(shown[i]) + 1; s.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
  }
}
function revealAnswer(b, node) {
  switch (b.type) {
    case "num": node.querySelector("input").value = b.answer; break;
    case "gap": { const answers = [...b.text.matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|")[0]); node.querySelectorAll("input.gap").forEach((inp, i) => { inp.value = answers[i]; inp.classList.remove("wrong"); }); break; }
    case "trace": { const answers = [...b.rows.flat().join("\u0001").matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|")[0]); node.querySelectorAll("input.gap").forEach((inp, i) => { inp.value = answers[i]; inp.classList.remove("wrong"); }); break; }
    case "bits": fillBits(node, "b", b.answer); break;
    case "fp": { const a = fpEncode(b.value); fillBits(node, "s", a.sign); fillBits(node, "m", a.mantissa); fillBits(node, "e", a.exponent); break; }
    case "choice": node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", Number(x.dataset.i) === b.correct)); break;
    case "multi": node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", b.correct.includes(Number(x.dataset.i)))); break;

let phpW = null, phpN = 0, phpBoot = null;
const phpPend = {};
function phpWorker() {
  if (phpBoot) return phpBoot;
  phpBoot = new Promise((resolve, reject) => {
    if (!LIB_BASE) { reject(new Error("PHP needs the site to be served over http(s).")); return; }
    phpW = new Worker(LIB_BASE + "php/php-worker.js", { type: "module" });
    phpW.onmessage = (e) => {
      if (e.data.type === "boot") { resolve(); return; }
      const p = phpPend[e.data.id];
      if (p) { delete phpPend[e.data.id]; p(e.data); }
    };
    phpW.onerror = (e) => reject(new Error(e.message || "PHP couldn't start"));
  });
  phpBoot.catch(() => { phpBoot = null; });
  return phpBoot;
}
async function phpCall(m, ms) {
  await phpWorker();

    m.id = ++phpN;

      delete phpPend[m.id];
      phpW.terminate(); phpBoot = null; phpLive = null;
      resolve({ ok: false, timeout: true, error: "Your PHP took too long, so it was stopped. Check for a loop that never ends." });
    }, ms || 8000);
    phpPend[m.id] = (d) => { clearTimeout(timer); resolve(d); };
    phpW.postMessage(m);

let phpLive = null;   // which task's website is loaded in the worker

document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a)return;e.preventDefault();var h=a.getAttribute("href")||"";if(/^(https?:|mailto:|tel:|#)/.test(h))return;parent.postMessage({wbNav:id,href:h},"*");},true);

      else if (e.target.closest(".code-check")) Promise.resolve(run("check")).then(() => refreshProgress(ch));
      else if (e.target.closest(".reset-code")) { node.querySelector(".editor").value = b.starter || ""; t.v = b.starter || ""; save(); if (b.type === "web") renderPreview(node, t.v); }
      else if (e.target.closest(".model-btn")) { node.querySelector(".model").hidden = false; if (t.s !== "correct") { t.s = "shown"; node.classList.add("is-shown"); } save(); refreshProgress(ch); }
      return;
    }
    if (e.target.closest(".hint-btn")) { const hn = node.querySelector(".hint"); hn.hidden = !hn.hidden; return; }
    if (e.target.closest(".show-btn")) { revealAnswer(b, node); if (t.s !== "correct") t.s = "shown"; node.className = "task is-shown"; fb.textContent = "Answer shown. Try the next one on your own."; save(); refreshProgress(ch); return; }
    if (e.target.closest(".mark-btn")) {
      const pts = node.querySelector(".points");
      t.v = node.querySelector("textarea").value;
      if (pts.hidden) { pts.hidden = false; t.s = "marked"; t.ticks = t.ticks || []; node.classList.add("is-marked"); e.target.textContent = "Hide marking points"; pts.querySelector(".score").textContent = `You gave yourself ${t.ticks.length} of ${b.marks}.`; }
      else { pts.hidden = true; e.target.textContent = "Mark my answer"; }
      save(); refreshProgress(ch); return;
    }
    const opt = e.target.closest(".opt");
    if (opt && b.type === "multi") { opt.classList.toggle("picked"); opt.setAttribute("aria-pressed", opt.classList.contains("picked")); return; }
    if (opt && b.type === "choice") {
      node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", x === opt));
      t.v = Number(opt.dataset.i); t.att++;
      if (t.v === b.correct) { t.s = t.s === "shown" ? "shown" : "correct"; node.className = "task is-correct"; fb.textContent = "Correct."; }
      else { fb.textContent = "Not yet. Try another option."; if (t.att >= 2) node.querySelector(".show-btn").hidden = false; }
      save(); refreshProgress(ch); return;
    }
    if (e.target.closest(".check-btn")) {
      const r = evaluate(b, node);
      t.v = r.v; t.att++;
      if (r.ok) { if (t.s !== "shown") t.s = "correct"; node.className = "task is-correct"; fb.textContent = "Correct."; node.querySelector(".show-btn").hidden = true; }
      else { fb.textContent = b.type === "bits" || b.type === "fp" ? "Not yet. The red bits are wrong; try again." : "Not yet. Check the highlighted answers and try again."; if (t.att >= 2) node.querySelector(".show-btn").hidden = false; }
      save(); refreshProgress(ch);
    }
  };
  m.onchange = (e) => {
    const cb = e.target.closest(".point input");
    if (!cb) return;
    const node = e.target.closest(".task[data-id]"); const b = byId[node.dataset.id]; const t = T(b.id);
    t.ticks = [...node.querySelectorAll(".point input")].map((x, i) => (x.checked ? i : -1)).filter((i) => i >= 0);
    node.querySelector(".score").textContent = `You gave yourself ${t.ticks.length} of ${b.marks}.`;
    save();
  };
  m.oninput = (e) => {
    const ta = e.target.closest("textarea");
    if (!ta) return;
    const t = T(ta.closest(".task").dataset.id);
    t.v = ta.value;
    save();
    const pn = ta.closest(".php-task"); if (pn) pn._dirty = true;
  };
  m.onkeydown = (e) => {
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("stdin-in")) { e.preventDefault(); e.target.parentNode.querySelector(".stdin-send").click(); return; }
    const ed = e.target.closest("textarea.editor");
    if (ed && e.key === "Escape") { ed.dataset.leave = "1"; return; }
    if (ed && e.key === "Tab" && ed.dataset.leave === "1") { delete ed.dataset.leave; return; }
    if (ed && (e.key === "Tab" || e.key === "Enter") && !e.ctrlKey && !e.metaKey && !e.altKey) {
      delete ed.dataset.leave;
      const { selectionStart: a, selectionEnd: z, value } = ed;
      let insert;
      if (e.key === "Tab") {
        if (e.shiftKey) return;
        insert = "    ";
      } else {
        const lineStart = value.lastIndexOf("\n", a - 1) + 1;
        const line = value.slice(lineStart, a);
        const indent = line.match(/^ */)[0];
        insert = "\n" + indent + (/:\s*$/.test(line) ? "    " : "");
      }
      e.preventDefault();
      ed.value = value.slice(0, a) + insert + value.slice(z);
      ed.selectionStart = ed.selectionEnd = a + insert.length;
      ed.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
    if (e.key === "Enter" && e.target.matches("input[type=text]")) { const n = e.target.closest(".task"); const btn = n && (n.querySelector(".check-btn") || n.querySelector(".gen-check")); if (btn) btn.click(); }
  };
}

// ---------- progress file ----------
const FILE_TAG = BOOK.tag;
function countDone(state) {
  return CHAPTERS.reduce((a, ch) => a + countable(ch).filter((b) => { const t = state.tasks[b.id]; return t && ["correct", "shown", "marked"].includes(t.s); }).length, 0);
}
const totalTasks = () => CHAPTERS.reduce((a, ch) => a + countable(ch).length, 0);
function setStatus(msg) { document.getElementById("save-status").textContent = msg; }

// Inside Claude, downloads go through the platform; on a self-hosted page, through an ordinary link.
let claudeDownloads = null;
try {
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then((d) => { claudeDownloads = d; }).catch(() => { claudeDownloads = null; });
  }
} catch (e) { claudeDownloads = null; }

document.getElementById("save-btn").onclick = async () => {
  const savedAt = new Date().toISOString();
  const data = JSON.stringify({ app: FILE_TAG, version: 1, savedAt, progress: Object.assign({}, S, { savedAt }) }, null, 1);
  const filename = `${BOOK.file}-progress-${savedAt.slice(0, 10)}.json`;
  const done = () => { S.savedAt = savedAt; save(); setStatus(`Saved ${countDone(S)} of ${totalTasks()} tasks to ${filename}. Keep it in your OneDrive or Google Drive.`); if (!location.hash || location.hash === "#home") route(); };
  if (claudeDownloads) {
    try { await claudeDownloads.save({ filename, data }); done(); }
    catch (err) {
      const code = err && err.code;
      if (code === "declined") setStatus("Download cancelled. Nothing was saved.");
      else if (code === "rate_limited") setStatus("A save is already waiting for you to confirm. Try again in a moment.");
      else setStatus("Downloads aren't available in this view. Open the workbook from your school's link to save a file.");
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    done();
  } catch (e) {
    setStatus("This browser blocked the download. Try another browser, or ask your teacher.");
  }
};

let pending = null;
document.getElementById("load-file").onchange = (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (d.app !== FILE_TAG || !d.progress || typeof d.progress.tasks !== "object") throw new Error("not ours");
      pending = { tasks: d.progress.tasks || {}, rag: d.progress.rag || {}, savedAt: d.progress.savedAt };
      const when = d.savedAt ? new Date(d.savedAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "an unknown date";
      document.getElementById("load-summary").textContent = `This file was saved on ${when} and has ${countDone(pending)} of ${totalTasks()} tasks done. You have ${countDone(S)} done here.`;
      document.getElementById("load-confirm").hidden = false;
      setStatus("");
    } catch (err) {
      setStatus(`That file isn't a ${BOOK.short} progress file. Choose the .json file you downloaded from this workbook.`);
    }
  };
  reader.onerror = () => setStatus("The file couldn't be read. Try choosing it again.");
  reader.readAsText(file);
};
document.getElementById("load-yes").onclick = () => {
  if (!pending) return;
  S = pending; pending = null; save();
  document.getElementById("load-confirm").hidden = true;
  setStatus(`Progress loaded: ${countDone(S)} of ${totalTasks()} tasks done.`);
  route();
};
document.getElementById("load-no").onclick = () => { pending = null; document.getElementById("load-confirm").hidden = true; setStatus("Nothing changed."); };

function route() {
  const id = location.hash.replace("#", "");
  const ch = CHAPTERS.find((c) => c.id === id);
  renderNav(ch ? ch.id : "home");
  if (ch) renderChapter(ch); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

</script>
