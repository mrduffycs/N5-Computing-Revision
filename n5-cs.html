}

  }
}
:root[data-theme="dark"] {

  color-scheme: dark;

<script>
// ---------- pure logic (tested in node) ----------
function toTwos(n, bits) {
  if (n < 0) n = n + 2 ** bits;
  let s = "";
  for (let i = 0; i < bits; i++) { s = (n % 2) + s; n = Math.floor(n / 2); }
  return s;
}
function toBinary(n, bits) { return toTwos(n, bits); }
function fromTwos(b) {
  let v = 0;
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let p = 2 ** (n - 1 - i);
    if (i === 0) p = -p;
    if (b[i] === "1") v += p;
  }
  return v;
}
function fpEncode(x, m = 15, e = 8) {
  const sign = x < 0 ? "1" : "0";
  x = Math.abs(x);
  let exp = 0;
  while (x >= 1) { x /= 2; exp++; }
  while (x > 0 && x < 0.5) { x *= 2; exp--; }
  let mant = "";
  for (let i = 0; i < m; i++) { x *= 2; const d = Math.floor(x); mant += d; x -= d; }
  return { sign, mantissa: mant, exponent: toTwos(exp, e), exp };
}
function fpDecode(sign, mant, expBits) {
  const e = fromTwos(expBits);
  let m = 0;
  for (let i = 0; i < mant.length; i++) if (mant[i] === "1") m += 2 ** -(i + 1);
  return (sign === "1" ? -1 : 1) * m * 2 ** e;
}
function sameNumber(input, answer) {
  const clean = String(input).replace(/[\s,£]/g, "").replace(/bytes?$/i, "").replace(/−/g, "-");
  if (clean === "") return false;
  const v = Number(clean);
  return !Number.isNaN(v) && Math.abs(v - Number(answer)) < 1e-9;
}
function sameText(input, accepted) {
  const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9.\-]/g, "");
  return accepted.some((a) => norm(a) === norm(input));
}
function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seedText) {
  let seed = 0;
  for (const ch of seedText) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
  const r = mulberry(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === arr[i]) && a.length > 1) a.push(a.shift());
  return a;
}
if (false) module.exports = { toTwos, fromTwos, fpEncode, fpDecode, sameNumber, sameText, seededShuffle };

const BOOK = { key: "n5-cs-workbook-v1", tag: "n5-cs-workbook", file: "n5-cs", short: "N5 Computer Systems", level: "n5",
  howto: ["<b>Bits</b>: click a bit to switch it between 0 and 1, then press Check.", "<b>Practice machines</b> make a new question every time, so you can keep practising.", "<b>Exam tips</b> are taken from the 2026 National 5 Computing Science course report, which describes where candidates lost marks."] };
// ---------- National 5 Computer Systems workbook ----------
const TIP = (t) => ({ type: "text", html: `<div class="callout"><b>Exam tip (2026 course report).</b> ${t}</div>` });

const CHAPTERS = [
{
  id: "binary", num: 1, title: "Binary numbers",
  intentions: ["I can explain why computers use binary", "I can convert 8-bit binary to denary", "I can convert denary numbers up to 255 to 8-bit binary"],
  recall: [],
  blocks: [
    { type: "text", html: `<h3>Why binary?</h3><p>Computers store everything with switches that are either off or on, so they use <b>binary</b>: only the digits 0 and 1. Each digit is a <b>bit</b>, and 8 bits make a <b>byte</b>.</p><p>Each bit has a <b>place value</b>, doubling from right to left. To convert binary to denary, add the place values wherever there is a 1.</p><table class="tbl"><tr><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>1</td></tr></table><p class="mono">64 + 8 + 4 + 1 = 77</p>` },
    { type: "num", id: "1a", q: "Convert <span class='mono'>00101010</span> to denary.", answer: 42 },
    { type: "num", id: "1b", q: "Convert <span class='mono'>11000011</span> to denary.", answer: 195 },
    { type: "text", html: `<h3>Denary to binary</h3><p>Work from the left: if the place value fits into what's left, write 1 and subtract it; if not, write 0.</p><p class="mono">100: 64 fits (36 left), 32 fits (4 left), 4 fits (0 left) → 01100100</p>` },
    { type: "bits", id: "1c", q: "Represent <b>100</b> in 8-bit binary.", n: 8, places: "plain", answer: "01100100" },

s</b> are small, very fast storage locations inside the processor that hold the data, instructions and addresses being used right now.</li><li>Every location in memory has a unique <b>memory address</b>.</li><li>The <b>address bus</b> carries the address of the memory location to be used, from the processor to memory.</li><li>The <b>data bus</b> carries data and instructions between the processor and memory, in both directions.</li></ul>` },

{

{

// ---------- state ----------
const KEY = BOOK.key;
let S = { tasks: {}, rag: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }
const T = (id) => (S.tasks[id] = S.tasks[id] || { att: 0 });
const isDone = (id) => { const t = S.tasks[id]; return !!t && ["correct", "shown", "marked"].includes(t.s); };

const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };

function countable(ch) { return [...ch.recall, ...ch.blocks, ...ch.exam].filter((b) => !["text", "figure", "gen", "dbview"].includes(b.type)); }
function progress(ch) { const items = countable(ch); const done = items.filter((b) => isDone(b.id)).length; return { done, total: items.length }; }

// ---------- task shell ----------
function shell(b, label, body, extra = "") {
  const t = S.tasks[b.id];
  const status = t && t.s === "correct" ? "is-correct" : t && t.s === "shown" ? "is-shown" : t && t.s === "marked" ? "is-marked" : "";
  return `<section class="task ${status}" data-id="${b.id}" id="task-${b.id}">
    <div class="task-head"><span class="tag">${label}</span>${b.marks ? `<span class="marks">${b.marks} mark${b.marks > 1 ? "s" : ""}</span>` : ""}</div>
    <div class="q">${b.q}</div>${body}
    <div class="actions">${extra}${b.hint ? `<button class="ghost hint-btn" type="button">Hint</button>` : ""}<button class="ghost show-btn" type="button" ${t && t.att >= 2 && t.s !== "correct" ? "" : "hidden"}>Show answer</button></div>
    ${b.hint ? `<div class="hint" hidden>${b.hint}</div>` : ""}
    <div class="feedback" aria-live="polite">${t && t.s === "correct" ? "Correct." : t && t.s === "shown" ? "Answer shown. Try the next one on your own." : ""}</div></section>`;
}
const checkBtn = `<button class="primary check-btn" type="button">Check</button>`;

function placeRow(kind, n) {
  if (kind === "none") return "";
  const vals = [];
  for (let i = 0; i < n; i++) vals.push(2 ** (n - 1 - i));
  if (kind === "twos") vals[0] = "−" + vals[0];
  return `<div class="bitrow places">${vals.map((v) => `<span>${v}</span>`).join("")}</div>`;
}
function bitCells(group, n, values) {
  let h = "";
  for (let i = 0; i < n; i++) h += `<button type="button" class="bit" data-group="${group}" data-i="${i}" aria-label="${group} bit ${i + 1}">${values ? values[i] : "0"}</button>`;
  return h;
}

// ---------- renderers ----------
const R = {
  num(b, label) {
    const t = S.tasks[b.id] || {};
    return shell(b, label, `<div class="answer-row"><input type="text" inputmode="decimal" autocomplete="off" id="in-${b.id}" aria-label="Your answer" value="${esc(t.v ?? "")}"></div>`, checkBtn);
  },
  gap(b, label) {
    const t = S.tasks[b.id] || {};
    let k = 0;
    const html = b.text.replace(/\{\{([^}]+)\}\}/g, (m, a) => { const i = k++; const v = (t.v || [])[i] ?? ""; return `<input class="gap" type="text" autocomplete="off" data-k="${i}" aria-label="Gap ${i + 1}" style="width:${Math.max(4, a.split("|")[0].length + 2)}ch" value="${esc(v)}">`; });
    return shell(b, label, `<p class="gap-text">${html}</p>`, checkBtn);
  },
  bits(b, label) {
    const t = S.tasks[b.id] || {};
    return shell(b, label, `<div class="bits">${placeRow(b.places || "twos", b.n)}<div class="bitrow">${bitCells("b", b.n, t.v)}</div></div><p class="small">Click a bit to change it.</p>`, checkBtn);
  },
  fp(b, label) {
    const t = S.tasks[b.id] || {};
    const v = t.v || {};
    return shell(b, label, `<div class="fp">
      <div class="fp-part"><span class="fp-label">Sign</span><div class="bitrow">${bitCells("s", 1, v.s)}</div></div>
      <div class="fp-part"><span class="fp-label">Mantissa (15 bits)</span><div class="bitrow">${bitCells("m", 15, v.m)}</div></div>
      <div class="fp-part"><span class="fp-label">Exponent (8 bits)</span><div class="bitrow">${bitCells("e", 8, v.e)}</div></div></div><p class="small">Click a bit to change it.</p>`, checkBtn);
  },
  choice(b, label) {
    const t = S.tasks[b.id] || {};
    return shell(b, label, `<div class="opts">${b.options.map((o, i) => `<button type="button" class="opt ${t.v === i ? "picked" : ""}" data-i="${i}">${o}</button>`).join("")}</div>`);
  },
  multi(b, label) {
    const t = S.tasks[b.id] || {};
    const v = t.v || [];
    return shell(b, label, `<div class="opts">${b.options.map((o, i) => `<button type="button" class="opt toggle ${v.includes(i) ? "picked" : ""}" aria-pressed="${v.includes(i)}" data-i="${i}">${o}</button>`).join("")}</div>`, checkBtn);
  },
  match(b, label) {
    const t = S.tasks[b.id] || {};
    const v = t.v || [];
    return shell(b, label, `<div class="match">${b.items.map((it, i) => `<label class="match-row"><span>${it[0]}</span><select data-k="${i}" aria-label="${esc(it[0])}"><option value="">Choose…</option>${b.options.map((o, j) => `<option value="${j}" ${String(v[i]) === String(j) ? "selected" : ""}>${o}</option>`).join("")}</select></label>`).join("")}</div>`, checkBtn);
  },
  order(b, label) {
    const t = S.tasks[b.id] || {};
    const shown = seededShuffle(b.items, b.id);
    const v = t.v || [];
    return shell(b, label, `<div class="match">${shown.map((it, i) => `<label class="match-row"><span class="${b.mono ? "mono-line" : ""}">${b.mono ? esc(it) : it}</span><select data-k="${i}" aria-label="Position of ${esc(it)}"><option value="">#</option>${b.items.map((_, j) => `<option value="${j + 1}" ${String(v[i]) === String(j + 1) ? "selected" : ""}>${j + 1}</option>`).join("")}</select></label>`).join("")}</div>`, checkBtn);
  },
  written(b, label) {
    const t = S.tasks[b.id] || {};

// ---------- reading answers ----------
const readBits = (node, g) => [...node.querySelectorAll(`.bit[data-group="${g}"]`)].map((x) => x.textContent).join("");
function markBits(node, g, answer) {
  node.querySelectorAll(`.bit[data-group="${g}"]`).forEach((x, i) => x.classList.toggle("wrong", x.textContent !== answer[i]));
}
function fillBits(node, g, answer) { node.querySelectorAll(`.bit[data-group="${g}"]`).forEach((x, i) => { x.textContent = answer[i]; x.classList.remove("wrong"); }); }

function evaluate(b, node) {
  switch (b.type) {
    case "num": { const v = node.querySelector("input").value; return { v, ok: sameNumber(v, b.answer) }; }
    case "gap": {
      const ins = [...node.querySelectorAll("input.gap")];
      const answers = [...b.text.matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|"));
      const v = ins.map((i) => i.value);
      let ok = true;
      ins.forEach((inp, i) => { const good = sameText(inp.value, answers[i]); inp.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "trace": {
      const ins = [...node.querySelectorAll("input.gap")];
      const answers = [...b.rows.flat().join("\u0001").matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|"));
      const v = ins.map((i) => i.value);
      let ok = true;
      ins.forEach((inp, i) => { const good = sameText(inp.value, answers[i]); inp.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "bits": { const v = readBits(node, "b"); markBits(node, "b", b.answer); return { v: v.split(""), ok: v === b.answer }; }
    case "fp": {
      const a = fpEncode(b.value);
      const v = { s: readBits(node, "s").split(""), m: readBits(node, "m").split(""), e: readBits(node, "e").split("") };
      markBits(node, "s", a.sign); markBits(node, "m", a.mantissa); markBits(node, "e", a.exponent);
      return { v, ok: v.s.join("") === a.sign && v.m.join("") === a.mantissa && v.e.join("") === a.exponent };
    }
    case "multi": {
      const v = [...node.querySelectorAll(".opt.picked")].map((x) => Number(x.dataset.i));
      const ok = v.length === b.correct.length && b.correct.every((c) => v.includes(c));
      return { v, ok };
    }
    case "match": {
      const sels = [...node.querySelectorAll("select")];
      const v = sels.map((s) => s.value);
      let ok = true;
      sels.forEach((s, i) => { const good = s.value !== "" && Number(s.value) === b.items[i][1]; s.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "order": {
      const shown = seededShuffle(b.items, b.id);
      const sels = [...node.querySelectorAll("select")];
      const v = sels.map((s) => s.value);
      let ok = true;
      sels.forEach((s, i) => { const good = Number(s.value) === b.items.indexOf(shown[i]) + 1; s.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
  }
}
function revealAnswer(b, node) {
  switch (b.type) {
    case "num": node.querySelector("input").value = b.answer; break;
    case "gap": { const answers = [...b.text.matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|")[0]); node.querySelectorAll("input.gap").forEach((inp, i) => { inp.value = answers[i]; inp.classList.remove("wrong"); }); break; }
    case "trace": { const answers = [...b.rows.flat().join("\u0001").matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|")[0]); node.querySelectorAll("input.gap").forEach((inp, i) => { inp.value = answers[i]; inp.classList.remove("wrong"); }); break; }
    case "bits": fillBits(node, "b", b.answer); break;
    case "fp": { const a = fpEncode(b.value); fillBits(node, "s", a.sign); fillBits(node, "m", a.mantissa); fillBits(node, "e", a.exponent); break; }
    case "choice": node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", Number(x.dataset.i) === b.correct)); break;
    case "multi": node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", b.correct.includes(Number(x.dataset.i)))); break;
    case "match": node.querySelectorAll("select").forEach((s, i) => { s.value = b.items[i][1]; s.classList.remove("wrong"); }); break;
    case "order": { const shown = seededShuffle(b.items, b.id); node.querySelectorAll("select").forEach((s, i) => { s.value = b.items.indexOf(shown[i]) + 1; s.classList.remove("wrong"); }); break; }
  }
}

// ---------- generators ----------
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const GEN = {
  bin() { const n = rnd(1, 255); return { q: `Represent <b>${n}</b> in 8-bit binary.`, input: "bits", n: 8, answer: n.toString(2).padStart(8, "0"), places: "plain" }; },
  fromBin() { const n = rnd(1, 255); return { q: `Convert <span class="mono">${n.toString(2).padStart(8, "0")}</span> to denary.`, input: "num", answer: n }; },
  n5predef() {
    const words = ["Glasgow", "Inverness", "Aberdeen", "Stirling", "Dundee", "Kirkwall", "Paisley", "Oban"];
    const k = pick(["len", "round", "round1"]);
    if (k === "len") { const w = pick(words); return { q: `What is <span class="mono">len("${w}")</span>?`, input: "num", answer: w.length }; }
    if (k === "round") { const x = rnd(100, 999) / 10 + 0.04; return { q: `What is <span class="mono">round(${x.toFixed(2)})</span>?`, input: "num", answer: Math.round(x) }; }
    const x = rnd(1000, 9999) / 100 + 0.004; return { q: `What is <span class="mono">round(${x.toFixed(3)}, 1)</span>?`, input: "num", answer: Math.round(x * 10) / 10 };
  },
  twos() { const n = rnd(-128, -1); return { q: `Represent <b>${n}</b> in 8-bit two's complement.`, input: "bits", n: 8, answer: toTwos(n, 8) }; },
  fromTwos() { const n = rnd(-128, -1); return { q: `Convert <span class="mono">${toTwos(n, 8)}</span> to denary.`, input: "num", answer: n }; },
  fp() { const fr = pick([0, 0.5, 0.25, 0.75, 0.125, 0.375, 0.625, 0.875]); let v = rnd(0, 40) + fr; if (v === 0) v = 0.75; if (Math.random() < 0.4) v = -v; return { q: `Represent <b>${v}</b> in floating point (sign, 15-bit mantissa, 8-bit exponent).`, input: "fp", value: v }; },
  fpToDen() { const fr = pick([0.5, 0.25, 0.75, 0.125, 0.375]); let v = rnd(0, 20) + fr; if (Math.random() < 0.4) v = -v; const a = fpEncode(v); return { q: `Convert to denary: sign <span class="mono">${a.sign}</span>, mantissa <span class="mono">${a.mantissa}</span>, exponent <span class="mono">${a.exponent}</span>.`, input: "num", answer: v }; },
  text() { const c = pick([250, 500, 1200, 1500, 2000, 4000]); const bits = pick([8, 16, 32]); return { q: `How many bytes are needed for <b>${c}</b> characters in ${bits === 8 ? "8-bit extended ASCII" : bits + "-bit Unicode"}?`, input: "num", answer: (c * bits) / 8 }; },
  bitmap() { const w = pick([640, 800, 1024, 1280, 1920]); const h = pick([480, 600, 720, 768, 1080]); const d = pick([1, 8, 16, 24]); return { q: `What is the file size in <b>bytes</b> of a ${w} × ${h} image with a colour depth of ${d} bit${d > 1 ? "s" : ""}?`, input: "num", answer: (w * h * d) / 8 }; },

  predef() {
    const words = ["Glasgow", "Inverness", "Aberdeen", "Stirling", "Dundee", "Kirkwall", "Paisley"];
    const kind = pick(["mod", "int", "sub", "ord", "chr"]);
    if (kind === "mod") { const x = rnd(10, 99), y = rnd(2, 9); return { q: `What is <span class="mono">${x} % ${y}</span>?`, input: "num", answer: x % y }; }
    if (kind === "int") { const x = rnd(10, 99), y = rnd(2, 9); return { q: `What is <span class="mono">int(${x} / ${y})</span>?`, input: "num", answer: Math.floor(x / y) }; }
    if (kind === "sub") { const w = pick(words), a = rnd(0, 2), e = a + rnd(2, 4); return { q: `What is <span class="mono">"${w}"[${a}:${e}]</span>?`, input: "text", answer: w.slice(a, e) }; }
    if (kind === "ord") { const c = String.fromCharCode(pick([rnd(65, 90), rnd(97, 122)])); return { q: `What is <span class="mono">ord("${c}")</span>?`, input: "num", answer: c.charCodeAt(0) }; }
    const n = rnd(65, 90); return { q: `What is <span class="mono">chr(${n})</span>?`, input: "text", answer: String.fromCharCode(n) };
  },
  maxpos() {
    const vals = []; while (vals.length < 6) { const v = rnd(2500, 4200); if (!vals.includes(v)) vals.push(v); }
    const findMax = Math.random() < 0.5; let pos = 0;
    for (let i = 1; i < vals.length; i++) if (findMax ? vals[i] > vals[pos] : vals[i] < vals[pos]) pos = i;
    return { q: `<span class="mono">times = [${vals.join(", ")}]</span><br>Find-${findMax ? "maximum" : "minimum"} returns a position. What position does it return? (The first element is position 0.)`, input: "num", answer: pos };
  },
};
const genState = {};
function newGen(node) {
  const kind = node.dataset.kind;
  const g = GEN[kind]();
  const st = (genState[node.dataset.id] = genState[node.dataset.id] || { streak: 0, done: 0 });
  st.cur = g; st.att = 0; st.solved = false;
  let body = `<p class="q">${g.q}</p>`;
  if (g.input === "num") body += `<div class="answer-row"><input type="text" inputmode="decimal" autocomplete="off" aria-label="Your answer"></div>`;
  if (g.input === "text") body += `<div class="answer-row"><input type="text" autocomplete="off" aria-label="Your answer"></div>`;
  if (g.input === "bits") body += `<div class="bits">${placeRow(g.places || "twos", 8)}<div class="bitrow">${bitCells("b", 8)}</div></div>`;
  if (g.input === "fp") body += `<div class="fp"><div class="fp-part"><span class="fp-label">Sign</span><div class="bitrow">${bitCells("s", 1)}</div></div><div class="fp-part"><span class="fp-label">Mantissa (15 bits)</span><div class="bitrow">${bitCells("m", 15)}</div></div><div class="fp-part"><span class="fp-label">Exponent (8 bits)</span><div class="bitrow">${bitCells("e", 8)}</div></div></div>`;
  node.querySelector(".gen-body").innerHTML = body;

}
function updateStreak(node) { const st = genState[node.dataset.id]; node.querySelector(".streak").textContent = st && st.done ? `${st.done} solved · streak ${st.streak}` : ""; }
function checkGen(node) {
  const st = genState[node.dataset.id]; const g = st.cur; let ok;
  if (g.input === "num") ok = sameNumber(node.querySelector(".gen-body input").value, g.answer);
  if (g.input === "text") ok = node.querySelector(".gen-body input").value.trim().replace(/^["']|["']$/g, "") === g.answer;
  if (g.input === "bits") { ok = readBits(node, "b") === g.answer; markBits(node, "b", g.answer); }
  if (g.input === "fp") { const a = fpEncode(g.value); ok = readBits(node, "s") === a.sign && readBits(node, "m") === a.mantissa && readBits(node, "e") === a.exponent; markBits(node, "s", a.sign); markBits(node, "m", a.mantissa); markBits(node, "e", a.exponent); }

  else if (!ok) { st.att++; fb.textContent = "Not yet. Red bits or values are wrong; try again."; if (st.att >= 2) node.querySelector(".gen-show").hidden = false; }

  if (g.input === "bits") fillBits(node, "b", g.answer);

const SQL_BASES = [LIB_BASE ? LIB_BASE + "sqljs/" : "", "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/"].filter(Boolean);

function mysqlSql(s) {

}

// ---------- PHP tasks: PHP 8.3 running in a worker ----------
let phpW = null, phpN = 0, phpBoot = null;
const phpPend = {};
function phpWorker() {
  if (phpBoot) return phpBoot;
  phpBoot = new Promise((resolve, reject) => {
    if (!LIB_BASE) { reject(new Error("PHP needs the site to be served over http(s).")); return; }
    phpW = new Worker(LIB_BASE + "php/php-worker.js", { type: "module" });
    phpW.onmessage = (e) => {
      if (e.data.type === "boot") { resolve(); return; }
      const p = phpPend[e.data.id];
      if (p) { delete phpPend[e.data.id]; p(e.data); }
    };
    phpW.onerror = (e) => reject(new Error(e.message || "PHP couldn't start"));
  });
  phpBoot.catch(() => { phpBoot = null; });
  return phpBoot;
}
async function phpCall(m, ms) {
  await phpWorker();
  return new Promise((resolve) => {
    m.id = ++phpN;
    const timer = setTimeout(() => {
      delete phpPend[m.id];
      phpW.terminate(); phpBoot = null; phpLive = null;
      resolve({ ok: false, timeout: true, error: "Your PHP took too long, so it was stopped. Check for a loop that never ends." });
    }, ms || 8000);
    phpPend[m.id] = (d) => { clearTimeout(timer); resolve(d); };
    phpW.postMessage(m);
  });
}
let phpLive = null;   // which task's website is loaded in the worker
function phpFiles(b, node) { return Object.assign({}, b.files || {}, { [b.file]: node.querySelector(".editor").value }); }
async function phpReset(b, node, files) {
  const r = await phpCall({ cmd: "reset", files, seed: seedSql() }, 90000);
  phpLive = r.ok ? b.id : null;
  return r;
}
function phpErrorLine(r) {
  const e = (r.errors || "").split("\n").find((l) => /Fatal|Parse error|syntax error/i.test(l)) || "";
  return e.replace(/^PHP\s+/, "").replace(/ in \/www\//, " in ").trim();
}
function inlineAssets(html, files) {
  return html.replace(/<link[^>]*href=["']([^"']+\.css)["'][^>]*>/gi, (m, f) => (files[f] != null ? `<style>${files[f]}</style>` : m));
}
function showPhpPage(b, node, page, r, files) {
  node._page = page.split("?")[0];
  node.querySelector(".addr").textContent = page;
  const con = node.querySelector(".console");
  const fatal = phpErrorLine(r);
  con.hidden = !(fatal || !r.ok || r.status === 404);
  con.textContent = !r.ok ? r.error : r.status === 404 ? r.errors : fatal;
  const nav = `<script>(function(){var id=${JSON.stringify(b.id)};
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a)return;e.preventDefault();var h=a.getAttribute("href")||"";if(/^(https?:|mailto:|tel:|#)/.test(h))return;parent.postMessage({wbNav:id,href:h},"*");},true);
document.addEventListener("submit",function(e){e.preventDefault();var f=e.target,fd=new FormData(f);if(e.submitter&&e.submitter.name)fd.append(e.submitter.name,e.submitter.value);parent.postMessage({wbNav:id,href:f.getAttribute("action")||"",method:(f.getAttribute("method")||"GET").toUpperCase(),body:new URLSearchParams(fd).toString()},"*");},true);})();<\/script>`;
  let html = withImages(inlineAssets(r.text || "", files));
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (m) => m + nav) : nav + html;
  node.querySelector(".preview").srcdoc = html;
}
async function phpOpen(b, node, page, method, body) {
  const fb = node.querySelector(".feedback");
  const files = phpFiles(b, node);
  if (phpLive !== b.id || node._dirty !== false) {
    fb.textContent = phpBoot ? "Starting your website…" : "Loading PHP (the first time takes a few seconds)…";
    const rr = await phpReset(b, node, files);
    if (!rr.ok) { fb.textContent = "PHP couldn't start: " + rr.error; return; }
    node._dirty = false;
  }
  const r = await phpCall({ cmd: "request", page, method: method || "GET", body: body || "" });
  showPhpPage(b, node, page, r, files);
  fb.textContent = r.timeout ? r.error : "Use the page in the browser box. Press Check to test your code.";
}
function resolveHref(node, href) {
  const cur = node._page || "";
  href = (href || "").replace(/^\.\//, "");
  if (!href) return cur;
  if (href.startsWith("?")) return cur + href;
  return href;
}
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || !d.wbNav) return;
  const node = document.getElementById("task-" + d.wbNav);
  if (!node) return;
  const b = node._block;
  let page = resolveHref(node, d.href);
  if (d.method === "POST") phpOpen(b, node, page, "POST", d.body);
  else phpOpen(b, node, d.body != null && d.body !== "" ? page.split("?")[0] + "?" + d.body : page, "GET");
});
const enc = (o) => new URLSearchParams(o || {}).toString();
async function phpCheck(b, node) {
  const fb = node.querySelector(".feedback");
  const t = T(b.id);
  const files = phpFiles(b, node);
  t.v = files[b.file]; t.att++;
  fb.textContent = phpBoot ? "Testing your website…" : "Loading PHP (the first time takes a few seconds)…";
  let problem = null;
  const rr = await phpReset(b, node, files);
  node._dirty = true;
  if (!rr.ok) problem = "PHP couldn't start: " + rr.error;
  let last = null, lastPage = b.entry || b.file;
  for (const step of problem ? [] : b.checks) {
    if (step.php) await phpCall({ cmd: "write", name: "__check.php", text: step.php });
    const page = step.php ? "__check.php" : step.page + (step.get ? "?" + enc(step.get) : "");
    const r = await phpCall({ cmd: "request", page, method: step.post ? "POST" : "GET", body: enc(step.post) });
    if (!r.ok) { problem = r.error; break; }
    if (!step.php) { last = r; lastPage = page; }
    const fatal = phpErrorLine(r);
    if (fatal) { problem = "PHP stopped with an error: " + fatal; break; }
    if (r.status === 404) { problem = r.errors; break; }
    const doc = new DOMParser().parseFromString(r.text || "", "text/html");
    try { problem = step.expect(doc, r.text || "", r); } catch (err) { problem = "The check couldn't read your page: " + err.message; }
    if (problem) break;
  }
  if (last) showPhpPage(b, node, lastPage, last, files);
  if (!problem) {
    if (t.s !== "shown") t.s = "correct";
    node.classList.add("is-correct"); node.classList.remove("is-shown");
    fb.textContent = "All checks passed.";
    node.querySelector(".model-btn").hidden = true;
  } else {
    fb.textContent = "Not yet: " + problem;
    if (t.att >= 2) node.querySelector(".model-btn").hidden = false;
  }
  save();
}
const pageText = (doc) => (doc.body ? doc.body.textContent : "").replace(/\s+/g, " ");

// ---------- views ----------
const $main = () => document.getElementById("main");
function labelFor(b, prefix, counter) { return `${prefix} ${counter}`; }

function renderChapter(ch) {
  let n = 0;
  const lab = () => `Try it ${ch.num}.${++n}`;
  const p = progress(ch);
  const rag = S.rag[ch.id] || [];
  const idx = CHAPTERS.indexOf(ch);
  let h = `<header class="ch-head"><p class="eyebrow">Chapter ${ch.num}</p><h2>${ch.title}</h2>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${p.total}" aria-valuenow="${p.done}"><span style="width:${(100 * p.done) / p.total}%"></span></div><p class="small">${p.done} of ${p.total} tasks done</p></header>
    <div class="intentions"><h3>Learning intentions</h3><ul>${ch.intentions.map((i) => `<li>${i}</li>`).join("")}</ul></div>`;
  if (ch.recall.length) {
    h += `<div class="recall"><h3>Quick recall</h3><p class="small">Questions from earlier chapters, to keep them fresh.</p>`;
    ch.recall.forEach((b, i) => { h += R[b.type](b, `Recall ${i + 1}`); });
    h += `</div>`;
  }
  ch.blocks.forEach((b) => { h += R[b.type](b, ["text", "figure", "gen", "dbview"].includes(b.type) ? "" : lab()); });
  h += `<div class="exam"><h3>Exam practice</h3><p class="small">Write a full answer, then mark it against the marking points.</p>`;
  ch.exam.forEach((b, i) => { h += R[b.type](b, `Exam ${ch.num}.${i + 1}`); });
  h += `</div><div class="rag"><h3>How confident are you?</h3>${ch.intentions.map((it, i) => `<div class="rag-row"><span>${it}</span><div class="rag-btns" role="group" aria-label="${esc(it)}">${["Not yet", "Getting there", "Confident"].map((l, j) => `<button type="button" class="rag-btn r${j} ${rag[i] === j ? "on" : ""}" data-i="${i}" data-j="${j}">${l}</button>`).join("")}</div></div>`).join("")}</div>
    <nav class="pager">${idx > 0 ? `<a href="#${CHAPTERS[idx - 1].id}">← ${CHAPTERS[idx - 1].title}</a>` : `<a href="#home">← Overview</a>`}${idx < CHAPTERS.length - 1 ? `<a href="#${CHAPTERS[idx + 1].id}">${CHAPTERS[idx + 1].title} →</a>` : `<a href="#home">Overview →</a>`}</nav>`;
  $main().innerHTML = h;
  $main().querySelectorAll(".task.gen").forEach(newGen);
  $main().querySelectorAll(".web-task").forEach((n) => renderPreview(n, n.querySelector(".editor").value));
  bindChapter(ch);
}

function renderHome() {
  const all = CHAPTERS.map(progress);
  const done = all.reduce((a, p) => a + p.done, 0), total = all.reduce((a, p) => a + p.total, 0);
  const next = CHAPTERS.find((c) => { const p = progress(c); return p.done < p.total; }) || CHAPTERS[0];
  $main().innerHTML = `<header class="hero"><p class="eyebrow">Higher Computing Science</p><h2>${BOOK.short} workbook</h2>
    <p class="lede">Learn a little, try it straight away, get instant feedback. Every chapter starts with quick recall from earlier chapters and ends with exam practice and a confidence check.</p>
    <div class="hero-stats"><div><b>${done}</b><span>of ${total} tasks done</span></div><a class="primary big" href="#${next.id}">${done ? "Continue" : "Start"}: ${next.title}</a></div></header>
    <div class="cards">${CHAPTERS.map((c, i) => { const p = all[i]; const rag = S.rag[c.id] || []; const conf = rag.filter((x) => x === 2).length; return `<a class="card ${p.done === p.total ? "complete" : ""}" href="#${c.id}"><span class="num">${c.num}</span><span class="ct">${c.title}</span><span class="bar"><span style="width:${(100 * p.done) / p.total}%"></span></span><span class="small">${p.done}/${p.total} tasks${conf ? ` · ${conf}/${c.intentions.length} confident` : ""}</span></a>`; }).join("")}</div>
    <div class="howto"><h3>How it works</h3><ul><li><b>Try it</b> tasks check your answer instantly. After two tries you can see the answer.</li>${BOOK.howto.map((h) => `<li>${h}</li>`).join("")}<li><b>Practice machines</b> make a new question every time, so you can practise as much as you like.</li><li><b>Exam practice</b>: write your answer, then tick the marking points it makes.</li></ul>
    <h3>Keeping your progress</h3><p>This browser remembers your work, but only on this device, and a shared school computer may forget it when you log off. At the end of each lesson, <b>download your progress file</b> and keep it in your OneDrive or Google Drive. Next time, on any device, <b>load</b> it to carry on where you left off.</p>
    <div class="save-row"><button type="button" class="primary home-save">Download my progress</button><button type="button" class="ghost home-load">Load my progress</button></div>
    <p class="small">${S.savedAt ? `Last downloaded: ${new Date(S.savedAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}.` : "You haven't downloaded a progress file yet."} <button type="button" class="link reset-btn">Reset my progress</button></p><div class="confirm" hidden><p>Clear every answer and start again?</p><button type="button" class="primary danger yes-reset">Yes, clear it</button><button type="button" class="ghost no-reset">Keep my progress</button></div></div>`;
  $main().querySelector(".home-save").onclick = () => document.getElementById("save-btn").click();
  $main().querySelector(".home-load").onclick = () => document.getElementById("load-file").click();
  $main().querySelector(".reset-btn").onclick = () => { $main().querySelector(".confirm").hidden = false; };
  $main().querySelector(".no-reset").onclick = () => { $main().querySelector(".confirm").hidden = true; };
  $main().querySelector(".yes-reset").onclick = () => { S = { tasks: {}, rag: {} }; save(); route(); };
}

function renderNav(active) {
  document.getElementById("nav").innerHTML = `<a href="#home" class="${active === "home" ? "on" : ""}"><span class="num">·</span>Overview</a>` + CHAPTERS.map((c) => { const p = progress(c); return `<a href="#${c.id}" class="${active === c.id ? "on" : ""} ${p.done === p.total ? "complete" : ""}"><span class="num">${c.num}</span><span class="nt">${c.title}</span><span class="mini">${p.done}/${p.total}</span></a>`; }).join("");
}

function refreshProgress(ch) {
  const p = progress(ch);
  const head = $main().querySelector(".ch-head");
  if (head) { head.querySelector(".bar span").style.width = (100 * p.done) / p.total + "%"; head.querySelector(".small").textContent = `${p.done} of ${p.total} tasks done`; }
  renderNav(ch.id);
}

function bindChapter(ch) {
  const all = [...ch.recall, ...ch.blocks, ...ch.exam];
  const byId = Object.fromEntries(all.filter((b) => b.id).map((b) => [b.id, b]));
  const m = $main();
  m.onclick = (e) => {
    const bit = e.target.closest(".bit");
    if (bit) { bit.textContent = bit.textContent === "1" ? "0" : "1"; bit.classList.remove("wrong"); return; }
    const gnode = e.target.closest(".task.gen");
    if (gnode) {
      if (e.target.closest(".gen-new")) newGen(gnode);
      else if (e.target.closest(".gen-check")) checkGen(gnode);
      else if (e.target.closest(".gen-show")) showGen(gnode);
      return;
    }
    const rb = e.target.closest(".rag-btn");
    if (rb) { const r = (S.rag[ch.id] = S.rag[ch.id] || []); r[Number(rb.dataset.i)] = Number(rb.dataset.j); save(); rb.parentNode.querySelectorAll(".rag-btn").forEach((x) => x.classList.toggle("on", x === rb)); return; }
    const node = e.target.closest(".task[data-id]");
    if (!node) return;
    const b = byId[node.dataset.id];
    const t = T(b.id);
    const fb = node.querySelector(".feedback");
    const wbtn = e.target.closest(".width-btn");
    if (wbtn) { const f = node.querySelector(".preview"); f.style.width = wbtn.dataset.w ? wbtn.dataset.w + "px" : ""; return; }
    if (b.type === "php") {
      node._block = b;
      if (e.target.closest(".run-btn")) { node._dirty = true; phpOpen(b, node, b.entry || b.file, b.runPost ? "POST" : "GET", b.runPost ? enc(b.runPost) : ""); }
      else if (e.target.closest(".code-check")) phpCheck(b, node).then(() => refreshProgress(ch));
      else if (e.target.closest(".reset-code")) { node.querySelector(".editor").value = b.starter || ""; t.v = b.starter || ""; node._dirty = true; save(); }
      else if (e.target.closest(".model-btn")) { node.querySelector(".model").hidden = false; if (t.s !== "correct") { t.s = "shown"; node.classList.add("is-shown"); } save(); refreshProgress(ch); }
      return;
    }
    if (b.type === "code" || b.type === "web" || b.type === "sql") {
      const run = b.type === "code" ? (m) => codeRun(b, node, m) : b.type === "sql" ? (m) => sqlTask(b, node, m) : (m) => (m === "run" ? renderPreview(node, node.querySelector(".editor").value) : webCheck(b, node));
      if (e.target.closest(".run-btn")) run("run");
      else if (e.target.closest(".stdin-send")) run("input");
      else if (e.target.closest(".code-check")) Promise.resolve(run("check")).then(() => refreshProgress(ch));
      else if (e.target.closest(".reset-code")) { node.querySelector(".editor").value = b.starter || ""; t.v = b.starter || ""; save(); if (b.type === "web") renderPreview(node, t.v); }
      else if (e.target.closest(".model-btn")) { node.querySelector(".model").hidden = false; if (t.s !== "correct") { t.s = "shown"; node.classList.add("is-shown"); } save(); refreshProgress(ch); }
      return;
    }
    if (e.target.closest(".hint-btn")) { const hn = node.querySelector(".hint"); hn.hidden = !hn.hidden; return; }
    if (e.target.closest(".show-btn")) { revealAnswer(b, node); if (t.s !== "correct") t.s = "shown"; node.className = "task is-shown"; fb.textContent = "Answer shown. Try the next one on your own."; save(); refreshProgress(ch); return; }
    if (e.target.closest(".mark-btn")) {
      const pts = node.querySelector(".points");
      t.v = node.querySelector("textarea").value;
      if (pts.hidden) { pts.hidden = false; t.s = "marked"; t.ticks = t.ticks || []; node.classList.add("is-marked"); e.target.textContent = "Hide marking points"; pts.querySelector(".score").textContent = `You gave yourself ${t.ticks.length} of ${b.marks}.`; }
      else { pts.hidden = true; e.target.textContent = "Mark my answer"; }
      save(); refreshProgress(ch); return;
    }
    const opt = e.target.closest(".opt");
    if (opt && b.type === "multi") { opt.classList.toggle("picked"); opt.setAttribute("aria-pressed", opt.classList.contains("picked")); return; }
    if (opt && b.type === "choice") {
      node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", x === opt));
      t.v = Number(opt.dataset.i); t.att++;
      if (t.v === b.correct) { t.s = t.s === "shown" ? "shown" : "correct"; node.className = "task is-correct"; fb.textContent = "Correct."; }
      else { fb.textContent = "Not yet. Try another option."; if (t.att >= 2) node.querySelector(".show-btn").hidden = false; }
      save(); refreshProgress(ch); return;
    }
    if (e.target.closest(".check-btn")) {
      const r = evaluate(b, node);
      t.v = r.v; t.att++;
      if (r.ok) { if (t.s !== "shown") t.s = "correct"; node.className = "task is-correct"; fb.textContent = "Correct."; node.querySelector(".show-btn").hidden = true; }
      else { fb.textContent = b.type === "bits" || b.type === "fp" ? "Not yet. The red bits are wrong; try again." : "Not yet. Check the highlighted answers and try again."; if (t.att >= 2) node.querySelector(".show-btn").hidden = false; }
      save(); refreshProgress(ch);
    }
  };
  m.onchange = (e) => {
    const cb = e.target.closest(".point input");
    if (!cb) return;
    const node = e.target.closest(".task[data-id]"); const b = byId[node.dataset.id]; const t = T(b.id);
    t.ticks = [...node.querySelectorAll(".point input")].map((x, i) => (x.checked ? i : -1)).filter((i) => i >= 0);
    node.querySelector(".score").textContent = `You gave yourself ${t.ticks.length} of ${b.marks}.`;
    save();
  };
  m.oninput = (e) => {
    const ta = e.target.closest("textarea");
    if (!ta) return;
    const t = T(ta.closest(".task").dataset.id);
    t.v = ta.value;
    save();
    const pn = ta.closest(".php-task"); if (pn) pn._dirty = true;
  };
  m.onkeydown = (e) => {
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("stdin-in")) { e.preventDefault(); e.target.parentNode.querySelector(".stdin-send").click(); return; }
    const ed = e.target.closest("textarea.editor");
    if (ed && e.key === "Escape") { ed.dataset.leave = "1"; return; }
    if (ed && e.key === "Tab" && ed.dataset.leave === "1") { delete ed.dataset.leave; return; }
    if (ed && (e.key === "Tab" || e.key === "Enter") && !e.ctrlKey && !e.metaKey && !e.altKey) {
      delete ed.dataset.leave;
      const { selectionStart: a, selectionEnd: z, value } = ed;
      let insert;
      if (e.key === "Tab") {
        if (e.shiftKey) return;
        insert = "    ";
      } else {
        const lineStart = value.lastIndexOf("\n", a - 1) + 1;
        const line = value.slice(lineStart, a);
        const indent = line.match(/^ */)[0];
        insert = "\n" + indent + (/:\s*$/.test(line) ? "    " : "");
      }
      e.preventDefault();
      ed.value = value.slice(0, a) + insert + value.slice(z);
      ed.selectionStart = ed.selectionEnd = a + insert.length;
      ed.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
    if (e.key === "Enter" && e.target.matches("input[type=text]")) { const n = e.target.closest(".task"); const btn = n && (n.querySelector(".check-btn") || n.querySelector(".gen-check")); if (btn) btn.click(); }
  };
}

// ---------- progress file ----------
const FILE_TAG = BOOK.tag;
function countDone(state) {
  return CHAPTERS.reduce((a, ch) => a + countable(ch).filter((b) => { const t = state.tasks[b.id]; return t && ["correct", "shown", "marked"].includes(t.s); }).length, 0);
}
const totalTasks = () => CHAPTERS.reduce((a, ch) => a + countable(ch).length, 0);
function setStatus(msg) { document.getElementById("save-status").textContent = msg; }

// Inside Claude, downloads go through the platform; on a self-hosted page, through an ordinary link.
let claudeDownloads = null;
try {
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then((d) => { claudeDownloads = d; }).catch(() => { claudeDownloads = null; });
  }
} catch (e) { claudeDownloads = null; }

document.getElementById("save-btn").onclick = async () => {
  const savedAt = new Date().toISOString();
  const data = JSON.stringify({ app: FILE_TAG, version: 1, savedAt, progress: Object.assign({}, S, { savedAt }) }, null, 1);
  const filename = `${BOOK.file}-progress-${savedAt.slice(0, 10)}.json`;
  const done = () => { S.savedAt = savedAt; save(); setStatus(`Saved ${countDone(S)} of ${totalTasks()} tasks to ${filename}. Keep it in your OneDrive or Google Drive.`); if (!location.hash || location.hash === "#home") route(); };
  if (claudeDownloads) {
    try { await claudeDownloads.save({ filename, data }); done(); }
    catch (err) {
      const code = err && err.code;
      if (code === "declined") setStatus("Download cancelled. Nothing was saved.");
      else if (code === "rate_limited") setStatus("A save is already waiting for you to confirm. Try again in a moment.");
      else setStatus("Downloads aren't available in this view. Open the workbook from your school's link to save a file.");
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    done();
  } catch (e) {
    setStatus("This browser blocked the download. Try another browser, or ask your teacher.");
  }
};

let pending = null;
document.getElementById("load-file").onchange = (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (d.app !== FILE_TAG || !d.progress || typeof d.progress.tasks !== "object") throw new Error("not ours");
      pending = { tasks: d.progress.tasks || {}, rag: d.progress.rag || {}, savedAt: d.progress.savedAt };
      const when = d.savedAt ? new Date(d.savedAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "an unknown date";
      document.getElementById("load-summary").textContent = `This file was saved on ${when} and has ${countDone(pending)} of ${totalTasks()} tasks done. You have ${countDone(S)} done here.`;
      document.getElementById("load-confirm").hidden = false;
      setStatus("");
    } catch (err) {
      setStatus(`That file isn't a ${BOOK.short} progress file. Choose the .json file you downloaded from this workbook.`);
    }
  };
  reader.onerror = () => setStatus("The file couldn't be read. Try choosing it again.");
  reader.readAsText(file);
};
document.getElementById("load-yes").onclick = () => {
  if (!pending) return;
  S = pending; pending = null; save();
  document.getElementById("load-confirm").hidden = true;
  setStatus(`Progress loaded: ${countDone(S)} of ${totalTasks()} tasks done.`);
  route();
};
document.getElementById("load-no").onclick = () => { pending = null; document.getElementById("load-confirm").hidden = true; setStatus("Nothing changed."); };

function route() {
  const id = location.hash.replace("#", "");
  const ch = CHAPTERS.find((c) => c.id === id);
  renderNav(ch ? ch.id : "home");
  if (ch) renderChapter(ch); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
